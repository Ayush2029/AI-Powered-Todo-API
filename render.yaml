services:
  - type: web
    name: ai-todo-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todos-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: todos-db
    plan: free
    databaseName: todos_db
    user: todos_user
