services:
  - type: web
    name: ai-todo-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todos-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false   # Set manually in the Render dashboard — free key from aistudio.google.com
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-preview-04-17
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: todos-db
    plan: free
    databaseName: todos_db
    user: todos_user
